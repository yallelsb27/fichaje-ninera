<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fichaje Niñera</title>
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --primary: #7a5c3e;
    --primary-dark: #5e4530;
    --accent: #d98c4a;
    --text: #2e2a26;
    --muted: #8a8378;
    --border: #e6e1d8;
    --danger: #c25656;
    --success: #4a8c6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-success { background: var(--success); color: white; }
  .btn-success:hover { background: #3d7a5a; }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 10px; font-size: 12px; }
  .btn-small { padding: 6px 10px; font-size: 12px; }
  input {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    margin-top: 4px;
  }
  label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; }
  .badge {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    margin-top: 4px;
  }
  .badge-closed { background: var(--success); }
  .admin-toggle { font-size: 13px; color: var(--primary); background: none; border: 1px solid var(--primary); padding: 8px 14px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
  .actions-cell { display: flex; gap: 6px; }
  .price-box {
    display: flex; align-items: center; gap: 10px; background: #fbf7f0;
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 16px;
  }
  .price-box input { margin: 0; }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .summary { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-top: 10px; }
  .summary strong { color: var(--text); }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 20px 0; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  .closed-month {
    background: #f0f5ee;
    border: 1px solid #d0e0d0;
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 12px;
  }
  .closed-month h4 {
    margin: 0 0 8px 0;
    color: var(--success);
    font-size: 14px;
  }
  .closed-month .summary {
    margin-top: 4px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab {
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--border);
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
  }
  .tab.active {
    background: var(--primary);
    color: white;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// =========================================================
// CONFIGURACIÓN: pegá acá la URL de tu Web App de Apps Script
// =========================================================
const API_URL = "https://script.google.com/macros/s/AKfycbzI_XoVXc6C_8VE60hHPn5TICg7D_rGgBSk7gCiAfNbu4wZM4ZIVCCB_TlhuFUSseI/exec";

let state = {
  unlocked: false,
  password: null,
  showLoginForm: false,
  registros: [],
  registrosCerrados: [],
  precioHora: 0,
  editingId: null,
  loading: true,
  error: null,
  view: "current" // "current" or "closed"
};

function formatHoras(horasDecimal) {
  const horas = Math.floor(horasDecimal);
  const minutos = Math.round((horasDecimal - horas) * 60);
  return `${horas}:${String(minutos).padStart(2, '0')}hs`;
}

function render() {
  const app = document.getElementById("app");

  if (state.loading) {
    app.innerHTML = `<div class="loading">Cargando...</div>`;
    return;
  }

  const totalMes = state.registros.reduce((acc, r) => acc + Number(r.totalDia || 0), 0);
  const horasMes = state.registros.reduce((acc, r) => acc + Number(r.horasTrabajadas || 0), 0);
  const horasMesFormatted = formatHoras(horasMes);

  let html = `
    <div class="top-bar">
      <div>
        <h1 style="margin-bottom:2px;">🧾 Fichaje Niñera</h1>
        ${state.unlocked ? `<span class="badge">Modo administrador</span>` : ""}
      </div>
      ${state.unlocked
        ? `<button class="admin-toggle" onclick="lockAdmin()">Salir de admin</button>`
        : `<button class="admin-toggle" onclick="toggleAdminLogin()">🔑 Admin</button>`
      }
    </div>
  `;

  if (state.showLoginForm && !state.unlocked) {
    html += `
      <div class="card">
        <h3 style="margin-top:0;">Acceso administrador</h3>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="pwInput" placeholder="Contraseña" />
        </div>
        <button class="btn-primary" style="width:100%" onclick="tryLogin()">Entrar</button>
        ${state.error ? `<div class="error">${state.error}</div>` : ""}
      </div>
    `;
  }

  if (state.unlocked) {
    html += `
      <div class="price-box">
        <label style="white-space:nowrap;">💲 Precio por hora</label>
        <input type="number" id="precioInput" value="${state.precioHora}" step="0.01" />
        <button class="btn-primary btn-small" onclick="guardarPrecio()">Guardar</button>
      </div>
      <div class="card">
        <h3 style="margin-top:0;">${state.editingId ? "Editar registro" : "Cargar jornada"}</h3>
        <div class="field">
          <label>Fecha</label>
          <input type="date" id="fechaInput" />
        </div>
        <div class="row">
          <div class="field">
            <label>Hora ingreso</label>
            <input type="time" id="ingresoInput" />
          </div>
          <div class="field">
            <label>Hora salida</label>
            <input type="time" id="salidaInput" />
          </div>
        </div>
        <button class="btn-primary" style="width:100%" onclick="guardarRegistro()">
          ${state.editingId ? "Guardar cambios" : "Agregar"}
        </button>
        ${state.editingId ? `<button class="btn-secondary" style="width:100%;margin-top:8px;" onclick="cancelarEdicion()">Cancelar edición</button>` : ""}
        ${state.error ? `<div class="error">${state.error}</div>` : ""}
      </div>
    `;
  }

  // Tabs
  html += `
    <div class="tabs">
      <button class="tab ${state.view === 'current' ? 'active' : ''}" onclick="switchView('current')">📅 Mes actual</button>
      <button class="tab ${state.view === 'closed' ? 'active' : ''}" onclick="switchView('closed')">📁 Períodos cerrados</button>
    </div>
  `;

  if (state.view === 'current') {
    html += `<div class="card">`;
    if (state.registros.length === 0) {
      html += `<div class="empty">Todavía no hay registros cargados.</div>`;
    } else {
      html += `
        <table>
          <thead>
            <tr>
              <th>Fecha</th><th>Ingreso</th><th>Salida</th><th>Horas</th><th>Total</th>
              ${state.unlocked ? "<th></th>" : ""}
            </tr>
          </thead>
          <tbody>
      `;
      state.registros.forEach(r => {
        const horasFormatted = formatHoras(Number(r.horasTrabajadas));
        html += `
          <tr>
            <td>${r.fecha}</td>
            <td>${r.horaIngreso}</td>
            <td>${r.horaSalida}</td>
            <td>${horasFormatted}</td>
            <td>$${Number(r.totalDia).toFixed(2)}</td>
            ${state.unlocked ? `
              <td class="actions-cell">
                <button class="btn-secondary btn-small" onclick="editar('${r.id}')">✎</button>
                <button class="btn-danger btn-small" onclick="borrar('${r.id}')">✕</button>
              </td>` : ""}
          </tr>
        `;
      });
      html += `</tbody></table>`;
      html += `
        <div class="summary">
          <span>Horas totales: <strong>${horasMesFormatted}</strong></span>
          <span>Total a pagar: <strong>$${totalMes.toFixed(2)}</strong></span>
        </div>
      `;
    }
    html += `</div>`;

    // Botón de cerrar período
    if (state.unlocked && state.registros.length > 0) {
      html += `
        <button class="btn-success" style="width:100%" onclick="cerrarPeriodo()">
          📦 Cerrar mes actual
        </button>
        <p style="font-size:12px;color:var(--muted);margin-top:6px;text-align:center;">
          Al cerrar el mes, los registros se archivarán y comenzará un nuevo período.
        </p>
      `;
    }
  } else {
    // Vista de períodos cerrados
    html += `<div class="card">`;
    if (state.registrosCerrados.length === 0) {
      html += `<div class="empty">No hay períodos cerrados.</div>`;
    } else {
      state.registrosCerrados.forEach((periodo, idx) => {
        const totalPeriodo = periodo.registros.reduce((acc, r) => acc + Number(r.totalDia || 0), 0);
        const horasPeriodo = periodo.registros.reduce((acc, r) => acc + Number(r.horasTrabajadas || 0), 0);
        const horasFormatted = formatHoras(horasPeriodo);
        html += `
          <div class="closed-month">
            <h4>📅 ${periodo.nombre || `Período ${idx + 1}`}</h4>
            <div style="font-size:13px;color:var(--muted);margin-bottom:6px;">
              ${periodo.fechaCierre ? `Cerrado el: ${periodo.fechaCierre}` : ''}
            </div>
            <div class="summary">
              <span>Horas totales: <strong>${horasFormatted}</strong></span>
              <span>Total: <strong>$${totalPeriodo.toFixed(2)}</strong></span>
            </div>
            ${state.unlocked ? `
              <button class="btn-danger btn-small" style="margin-top:8px;" onclick="borrarPeriodo(${idx})">🗑️ Eliminar período</button>
            ` : ''}
          </div>
        `;
      });
    }
    html += `</div>`;
  }

  app.innerHTML = html;

  if (state.showLoginForm && !state.unlocked) {
    const pwInput = document.getElementById("pwInput");
    if (pwInput) {
      pwInput.focus();
      pwInput.addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
    }
  }

  if (state.unlocked && !state.editingId && state.view === 'current') {
    const fechaInput = document.getElementById("fechaInput");
    if (fechaInput) fechaInput.valueAsDate = new Date();
  }
}

// ============ ACCIONES ============

function switchView(view) {
  state.view = view;
  render();
}

function toggleAdminLogin() {
  state.showLoginForm = !state.showLoginForm;
  state.error = null;
  render();
}

function lockAdmin() {
  state.unlocked = false;
  state.password = null;
  state.editingId = null;
  state.showLoginForm = false;
  render();
}

async function tryLogin() {
  const pw = document.getElementById("pwInput").value;
  if (!pw) return;
  state.password = pw;
  state.error = null;
  const ok = await postAction({ action: "verify" });
  if (ok) {
    state.unlocked = true;
    state.showLoginForm = false;
  } else {
    state.password = null;
  }
  render();
}

async function cargarDatos() {
  state.loading = true;
  render();
  try {
    const res = await fetch(API_URL + "?action=list");
    const data = await res.json();
    state.registros = data.registros || [];
    state.registrosCerrados = data.registrosCerrados || [];
    state.precioHora = data.precioHora || 0;
  } catch (err) {
    state.error = "No se pudo conectar con la planilla. Revisá la URL configurada.";
  }
  state.loading = false;
  render();
}

async function postAction(payload) {
  payload.password = state.password;
  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (data.error) {
    state.error = data.error;
    render();
    return false;
  }
  state.registros = data.registros || [];
  state.registrosCerrados = data.registrosCerrados || [];
  state.precioHora = data.precioHora || 0;
  state.error = null;
  return true;
}

async function guardarPrecio() {
  const precio = document.getElementById("precioInput").value;
  await postAction({ action: "setPrice", precio: precio });
  render();
}

async function guardarRegistro() {
  const fecha = document.getElementById("fechaInput").value;
  const ingreso = document.getElementById("ingresoInput").value;
  const salida = document.getElementById("salidaInput").value;
  if (!fecha || !ingreso || !salida) {
    state.error = "Completá fecha, hora de ingreso y hora de salida.";
    render();
    return;
  }
  const payload = state.editingId
    ? { action: "update", id: state.editingId, fecha, horaIngreso: ingreso, horaSalida: salida }
    : { action: "add", fecha, horaIngreso: ingreso, horaSalida: salida };

  const ok = await postAction(payload);
  if (ok) {
    state.editingId = null;
    render();
  }
}

function editar(id) {
  const r = state.registros.find(x => String(x.id) === String(id));
  if (!r) return;
  state.editingId = id;
  render();
  document.getElementById("fechaInput").value = r.fecha;
  document.getElementById("ingresoInput").value = r.horaIngreso;
  document.getElementById("salidaInput").value = r.horaSalida;
}

function cancelarEdicion() {
  state.editingId = null;
  render();
}

async function borrar(id) {
  if (!confirm("¿Borrar este registro?")) return;
  await postAction({ action: "delete", id: id });
  render();
}

async function cerrarPeriodo() {
  if (!confirm("¿Cerrar el mes actual? Los registros se archivarán y no se podrán modificar.")) return;
  await postAction({ action: "closePeriod" });
  render();
}

async function borrarPeriodo(idx) {
  if (!confirm("¿Eliminar este período cerrado?")) return;
  await postAction({ action: "deleteClosedPeriod", index: idx });
  render();
}

cargarDatos();
</script>
</body>
</html>
